<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO4WEB Tactile Navigation Bar Prototype</title>
  <style>
    :root {
      --bg-surface: #171717;
      --bg-page: #0f1012;
      --accent-emerald: #10b981;
      --accent-glow: #34d399;
      --text-main: #f4f4f5;
      --text-muted: #9ca3af;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      font-family: var(--font-stack);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-main);
      overflow-x: hidden;
    }

    .demo-info {
      margin-bottom: 40px;
      text-align: center;
    }

    .demo-info h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .demo-info p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* =========================================================
       TACTILE FLOATING NAVIGATION BAR (CONTAINER)
       ========================================================= */
    .tactile-nav-wrapper {
      position: relative;
      width: 100%;
      max-width: 540px;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.7)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
    }

    .tactile-nav-bar {
      position: relative;
      display: flex;
      align-items: center;
      height: 72px;
      background: var(--bg-surface);
      border-radius: 9999px;
      padding: 0 16px 0 10px;
      border: 1px solid var(--border-subtle);
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.15),
        inset 0 -2px 4px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    /* Top specular sheen highlight */
    .tactile-nav-bar::before {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      pointer-events-none;
    }

    /* =========================================================
       BRAND ORB (FAR LEFT COIN)
       ========================================================= */
    .brand-coin {
      position: relative;
      width: 52px;
      height: 52px;
      min-width: 52px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1f2023, #121315);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 4px 8px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.2),
        inset 0 -2px 4px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
      margin-right: 6px;
      z-index: 10;
    }

    .brand-coin:hover {
      transform: scale(1.04);
      box-shadow: 
        0 6px 14px rgba(0, 0, 0, 0.6),
        0 0 12px rgba(16, 185, 129, 0.3);
    }

    .brand-coin:active {
      transform: scale(0.96);
    }

    .brand-logo-glow {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-emerald);
      filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.8));
    }

    .brand-logo-glow svg {
      width: 24px;
      height: 24px;
    }

    /* =========================================================
       ITEMS CONTAINER & GLIDER / CRADLE
       ========================================================= */
    .nav-items-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      height: 100%;
    }

    /* FLUID WAVE CRADLE (Active indicator pill with wave curve) */
    .wave-cradle {
      position: absolute;
      top: 6px;
      bottom: 6px;
      width: 76px;
      border-radius: 36px;
      background: linear-gradient(180deg, #222327 0%, #171717 100%);
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.2),
        inset 0 -1px 2px rgba(0, 0, 0, 0.5),
        0 8px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events-none;
      z-index: 1;
    }

    /* Glowing Emerald neon accent contour line */
    .wave-cradle::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 36px;
      padding: 1.5px;
      background: linear-gradient(180deg, var(--accent-emerald), transparent 70%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      filter: drop-shadow(0 0 4px var(--accent-emerald));
    }

    /* Bottom continuous neon laser beam underline */
    .laser-beam-trace {
      position: absolute;
      bottom: 12px;
      left: 10px;
      right: 10px;
      height: 1.5px;
      background: linear-gradient(90deg, 
        rgba(16, 185, 129, 0.8) 0%, 
        rgba(16, 185, 129, 0.2) 60%, 
        transparent 100%
      );
      filter: drop-shadow(0 0 4px var(--accent-emerald));
      pointer-events-none;
      opacity: 0.6;
    }

    /* =========================================================
       INDIVIDUAL NAVIGATION ITEMS
       ========================================================= */
    .nav-btn {
      position: relative;
      flex: 1;
      height: 100%;
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.25s ease, transform 0.15s ease;
      z-index: 2;
      padding: 0 4px;
      outline: none;
    }

    .nav-btn:hover {
      color: #e4e4e7;
    }

    .nav-btn:active {
      transform: scale(0.92);
    }

    .nav-btn.active {
      color: #ffffff;
    }

    .nav-icon {
      position: relative;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 3px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease;
    }

    .nav-btn.active .nav-icon {
      transform: translateY(-2px);
      filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.6));
      color: var(--accent-emerald);
    }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: opacity 0.25s ease, color 0.25s ease;
    }

    .nav-btn.active .nav-label {
      color: #ffffff;
    }

    /* Active indicator glow dot under the label */
    .active-dot {
      position: absolute;
      bottom: 6px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: var(--accent-emerald);
      box-shadow: 0 0 6px 1px var(--accent-emerald);
      opacity: 0;
      transform: scale(0);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-btn.active .active-dot {
      opacity: 1;
      transform: scale(1);
    }

    /* Pulse Notification Badge (on Decay Radar) */
    .notif-badge {
      position: absolute;
      top: -2px;
      right: -3px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 6px var(--accent-emerald);
      animation: pulse-ring 2s infinite;
    }

    @keyframes pulse-ring {
      0% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        box-shadow: 0 0 0 5px rgba(16, 185, 129, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }
  </style>
</head>
<body>

  <div class="demo-info">
    <h1>SEO4WEB Tactile Navigation Bar</h1>
    <p>Klikaj na jednotlivé položky pre plynulú animáciu fluidnej vlnovky a neónového indikátora.</p>
  </div>

  <!-- TACTILE BAR CONTAINER -->
  <div class="tactile-nav-wrapper">
    <div class="tactile-nav-bar" id="tactileNavBar">
      
      <!-- Brand Coin (Far Left) -->
      <div class="brand-coin" id="brandCoin" title="SEO4WEB Command Center">
        <div class="brand-logo-glow">
          <!-- Radar / S4 Vector Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"></path>
            <path d="M12 6a6 6 0 1 0 6 6 6 6 0 0 0-6-6zm0 8a2 2 0 1 1 2-2 2 2 0 0 1-2 2z"></path>
            <path d="M12 2v4"></path>
          </svg>
        </div>
      </div>

      <!-- Nav Items & Sliding Wave Cradle -->
      <div class="nav-items-container" id="itemsContainer">
        
        <!-- The Fluid Wave Cradle Indicator -->
        <div class="wave-cradle" id="waveCradle"></div>

        <!-- 1. Dashboard -->
        <button class="nav-btn active" data-index="0">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>
          <span class="nav-label">Dashboard</span>
          <span class="active-dot"></span>
        </button>

        <!-- 2. SEO Raketa -->
        <button class="nav-btn" data-index="1">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
              <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path>
              <path d="M9 12H4s.55-3.03 2-4.5c1.62-1.63 5-2.5 5-2.5"></path>
              <path d="M12 15v5s3.03-.55 4.5-2c1.63-1.62 2.5-5 2.5-5"></path>
            </svg>
          </div>
          <span class="nav-label">Raketa</span>
          <span class="active-dot"></span>
        </button>

        <!-- 3. AI Tvorba -->
        <button class="nav-btn" data-index="2">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </div>
          <span class="nav-label">Tvorba</span>
          <span class="active-dot"></span>
        </button>

        <!-- 4. Decay Radar -->
        <button class="nav-btn" data-index="3">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span class="notif-badge"></span>
          </div>
          <span class="nav-label">Radar</span>
          <span class="active-dot"></span>
        </button>

        <!-- 5. Audit & Profil -->
        <button class="nav-btn" data-index="4">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <span class="nav-label">Audit</span>
          <span class="active-dot"></span>
        </button>

      </div>

      <!-- Laser Beam Underline -->
      <div class="laser-beam-trace"></div>

    </div>
  </div>

  <script>
    // Pure Vanilla JS Logic
    const buttons = document.querySelectorAll('.nav-btn');
    const waveCradle = document.getElementById('waveCradle');
    const brandCoin = document.getElementById('brandCoin');

    function updateCradlePosition(button) {
      if (!button || !waveCradle) return;
      
      const containerLeft = button.parentElement.getBoundingClientRect().left;
      const buttonRect = button.getBoundingClientRect();
      const cradleWidth = waveCradle.offsetWidth;
      
      // Center the cradle horizontally on the button
      const centerOffset = (buttonRect.left - containerLeft) + (buttonRect.width / 2) - (cradleWidth / 2);
      waveCradle.style.transform = `translateX(${centerOffset}px)`;
    }

    // Set initial position on load
    window.addEventListener('DOMContentLoaded', () => {
      const activeBtn = document.querySelector('.nav-btn.active');
      if (activeBtn) {
        updateCradlePosition(activeBtn);
      }
    });

    window.addEventListener('resize', () => {
      const activeBtn = document.querySelector('.nav-btn.active');
      if (activeBtn) {
        updateCradlePosition(activeBtn);
      }
    });

    // Handle button clicks
    buttons.forEach((btn) => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateCradlePosition(btn);

        // Optional Haptic feedback for supported mobile devices
        if (navigator.vibrate && navigator.userActivation?.hasBeenActive) {
          try { navigator.vibrate(12); } catch (_) {}
        }
      });
    });

    // Brand Coin Quick Click (resets to Dashboard)
    brandCoin.addEventListener('click', () => {
      const firstBtn = buttons[0];
      if (firstBtn) {
        firstBtn.click();
      }
    });
  </script>

</body>
</html>
